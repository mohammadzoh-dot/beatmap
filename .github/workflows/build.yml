name: Build My App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet publish demo/BeatMap.Hrv.Demo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./output
      - uses: upload-artifact@v4
        with:
          name: BeatMap-Windows-App
          path: ./output/BeatMap.Hrv.Demo.exe
