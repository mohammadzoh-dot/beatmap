name: Build Windows Software

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract All ZIP Files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.zip | ForEach-Object {
            Write-Host "Extracting $($_.FullName)..."
            Expand-Archive -Path $_.FullName -DestinationPath . -Force
          }
          Write-Host "Files list:"
          Get-ChildItem -Recurse | Select-Object FullName

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare and Build Project
        shell: pwsh
        run: |
          # پیدا کردن فایل پروژه موجود یا ساخت فایل پروژه جدید در صورت عدم وجود
          $proj = (Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.Name -match "Demo" -or $_.Name -match "Hrv" } | Select-Object -First 1)

          if (-not $proj) {
            Write-Host "Creating project file automatically..."
            $projXml = @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="OxyPlot.Wpf" Version="2.1.2" />
            </ItemGroup>
          </Project>
          "@
            Set-Content -Path "BeatMapApp.csproj" -Value $projXml
            $targetProj = "BeatMapApp.csproj"
          } else {
            $targetProj = $proj.FullName
          }

          Write-Host "Building project: $targetProj"
          dotnet publish $targetProj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./output

      - uses: actions/upload-artifact@v4
        with:
          name: BeatMap-Windows-Software
          path: ./output/*.exe
